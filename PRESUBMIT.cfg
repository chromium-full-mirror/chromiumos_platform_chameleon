[Hook Scripts]
cros format = cros format --check --commit ${PRESUBMIT_COMMIT} --exclude='v3/*' --exclude='utils/*' --exclude='*.h' --exclude='*.c' --exclude='*.conf' --exclude='*.json' --exclude='*.txt' ${PRESUBMIT_FILES}

[Hook Overrides]
black_check: true
keyword_check: true
cros_license_check: true
long_line_check: true
