- name: Preparing chameleon chroot for sd card deployment
  hosts: archlinuxarm-chroot
  vars:
    ansible_become: yes
    ansible_become_user: '{{username}}'
  tags: chameleon, chameleon_sd
  tasks:
    - name: Save packages touching /boot
      ansible.builtin.shell:
        chdir: '/home/{{username}}/'
        cmd: |
          rm -Rf boot_pkg
          mkdir boot_pkg
          for pkg_name in $(pacman -Qoq /boot/*|uniq); do
            pkg_file=/var/cache/pacman/pkg/${pkg_name}*
            echo ${pkg_file}
            cp ${pkg_file} boot_pkg/
          done

- name: Install chameleon from chroot to sd card image
  hosts: localhost
  vars:
    ansible_become: yes
    chroot_dir: '{{playbook_dir}}/build/chroot'
    sd_img: '{{playbook_dir}}/build/chameleon_{{fpga_type}}.img'
    btrfs_snapshot: "chameleon_{{fpga_type}}_{{hostvars['localhost']['version'].stdout}}"
    root_name: "rw_{{ btrfs_snapshot }}"
  tags: chameleon, chameleon_sd

  tasks:
    - name: Make sure things are unmounted
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R sd
          umount -R sd/*/boot
          # always successful no matter what
          exit 0
    - name: Allocate img.sd file
      ansible.builtin.shell: |
        dd if=/dev/zero of={{ sd_img }} bs=1M count=3500
    - name: Create /boot partition
      community.general.parted:
        device: '{{ sd_img }}'
        number: 1
        fs_type: ext4
        part_end: 590MB
        state: present

    - name: Create u-boot spl partition
      community.general.parted:
        device: '{{ sd_img }}'
        number: 2
        part_start: 590MB
        part_end: 600MB
        state: present

    - name: Create rootfs partition
      community.general.parted:
        device: '{{ sd_img }}'
        number: 3
        fs_type: btrfs
        part_start: 600MB
        state: present

    - name: losetup
      ansible.builtin.shell: |
        losetup -fP --show {{ sd_img }}
      register: losetup

    - name: Set u-boot spl partition type to 'a2'
      ansible.builtin.shell: |
        printf 't\n2\na2\nw\n' | fdisk {{losetup.stdout}}
        partprobe {{losetup.stdout}}
      tags: uboot

    - name: dd u-boot spl onto sd card partition
      ansible.builtin.shell: |
        dd if={{playbook_dir}}/build/chroot/boot/u-boot-splx4.sfp of={{losetup.stdout}}p2
        partprobe {{losetup.stdout}}
      tags: uboot

    - name: Format /boot filesystem
      community.general.filesystem:
        dev: '{{losetup.stdout}}p1'
        fstype: ext4
        opts: -L chameleon_boot
        state: present

    - name: Format rootfs filesystem
      community.general.filesystem:
        dev: '{{losetup.stdout}}p3'
        fstype: btrfs
        opts: -L chameleon_fs
        state: present

    - name: Create fs dir structure and mount everything in its proper spot
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          mkdir -p sd &&
          mount {{losetup.stdout}}p3 -o subvol=/ sd &&
          btrfs subvolume create sd/{{ root_name }} &&
          btrfs subvolume set-default sd/{{ root_name }} &&
          mkdir -p sd/{{ root_name }}/mnt/fs &&
          mkdir -p sd/{{ root_name }}/boot &&
          mount {{losetup.stdout}}p1 sd/{{ root_name }}/boot

    - name: Cleanup chroot source before copying
      # Less stuff to copy
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R chroot
          rm -Rf chroot/home/*/.cache/*
      tags: cleanup

    - name: Rsync rootfs from chroot to sd card
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          rsync --archive --hard-links --acls --xattrs --sparse -recursive chroot/* sd/{{ root_name }}/
          sync
      tags: copy

    - name: Snapshot root
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build/sd'
        cmd: |
          btrfs subvolume snapshot -r {{ root_name }} {{ btrfs_snapshot }}

    - name: Save snapshot as discrete file
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build/sd'
        cmd: |
          btrfs send {{ btrfs_snapshot }} | zstd -c > {{playbook_dir}}/build/{{ btrfs_snapshot }}.btrfs.zst

    - name: Unmount partitions
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R sd/*/boot
          umount -R sd
      tags: cleanup

    - name: Cleanup losetup
      ansible.builtin.shell: |
        losetup -d {{losetup.stdout}}
      tags: cleanup

    - name: Compress image
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
         tar --zstd -cf "{{ sd_img }}.tar.zst" "chameleon_{{fpga_type}}.img"
      tags: compress
