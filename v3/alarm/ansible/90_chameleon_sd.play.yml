- name: Install chameleon from chroot to sd card
  hosts: localhost
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_sd

  tasks:
    - name: Make sure things are unmounted
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          # source devices
          umount -R {{ sd_dev }}p1
          umount -R {{ sd_dev }}p3

          # taget
          umount -R sd/

          # always successful no matter what
          exit 0

    - name: Wipe existing sd partition table
      ansible.builtin.shell:
        cmd: |
          wipefs -a {{ sd_dev }}
      tags: wipe

    - name: Create /boot partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 1
        # sigh, parted won't actually mkfs, so what's the point of this fs_type
        # argument? see tasks later on for the actual format call
        fs_type: fat32
        part_start: 2MB # leave some room after preloader
        part_end: 500MB
        state: present

    - name: Create uboot preloader partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 2
        part_start: 500MB
        part_end: 600MB
        state: present

    - name: Create rootfs partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 3
        fs_type: btrfs
        part_start: 600MB
        state: present

    - name: Set Uboot preloader partition type to 'a2'
      ansible.builtin.shell:
        cmd: |
          printf 't\n2\na2\nw\n' | fdisk {{ sd_dev }}
      tags: uboot

    - name: dd uboot preloader onto sd card partition
      ansible.builtin.shell: |
        dd if={{ item.path }} of={{ sd_dev }}p2
        partprobe {{ sd_dev }}
      with_items: "{{ preloader_file['files'] }}"
      tags: uboot

    - name: Wipe /boot partition
      community.general.filesystem:
        dev: '{{ sd_dev }}p1'
        state: absent
      tags: wipe

    - name: Wipe rootfs partition
      community.general.filesystem:
        dev: '{{ sd_dev }}p3'
        state: absent
      tags: wipe

    - name: Format /boot filesystem
      community.general.filesystem:
        dev: '{{ sd_dev }}p1'
        fstype: vfat
        opts: -F 32 -n "chml_boot" # label has to be under 11 characters
        state: present

    - name: Format rootfs filesystem
      community.general.filesystem:
        dev: '{{ sd_dev }}p3'
        fstype: btrfs
        opts: -L "chameleon_fs"
        state: present

    - name: Mount partitions
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          mkdir -p sd &&
          mount {{ sd_dev }}p3 sd &&
          mkdir -p sd/boot &&
          mount {{ sd_dev }}p1 sd/boot

    - name: Install /etc/fstab
      ansible.builtin.copy:
        remote_src: yes
        src: '{{playbook_dir}}/files/fstab'
        dest: '{{playbook_dir}}/build/chroot/etc/fstab'

    - name: Cleanup chroot source before copying
      # Less stuff to copy
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R chroot
          rm -Rf chroot/var/cache/pacman/pkg/*
          rm -Rf chroot/home/*/.cache/*
        removes: chroot/var/cache/pacman/pkg/*
      tags: cleanup

    - name: Rsync rootfs from chroot to sd card
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          rsync --archive --hard-links --acls --xattrs --sparse -recursive chroot/* sd/
          sync

    - name: Unmount partitions
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R sd/boot
          umount -R sd
