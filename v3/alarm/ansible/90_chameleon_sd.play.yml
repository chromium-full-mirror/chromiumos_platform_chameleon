- name: Install chameleon from chroot to sd card
  hosts: localhost
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_sd

  tasks:
    - name: Make sure things are unmounted
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          # source devices
          umount -R {{ sd_dev }}p1
          umount -R {{ sd_dev }}p3

          # taget
          umount -R sd/

          # always successful no matter what
          exit 0

    - name: Wipe existing sd partition table
      ansible.builtin.shell:
        cmd: |
          wipefs -a {{ sd_dev }}
      tags: wipe

    - name: Create /boot partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 1
        # sigh, parted won't actually mkfs, so what's the point of this fs_type
        # argument? see tasks later on for the actual format call
        fs_type: ext4
        part_start: 2MB
        part_end: 590MB
        state: present

    - name: Create u-boot spl partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 2
        part_start: 590MB
        part_end: 600MB
        state: present

    - name: Create rootfs partition
      community.general.parted:
        device: '{{ sd_dev }}'
        number: 3
        fs_type: btrfs
        part_start: 600MB
        state: present

    - name: Set u-boot spl partition type to 'a2'
      ansible.builtin.shell:
        cmd: |
          printf 't\n2\na2\nw\n' | fdisk {{ sd_dev }}
          partprobe {{ sd_dev }}
      tags: uboot

    - name: dd u-boot spl onto sd card partition
      ansible.builtin.shell: |
        dd if={{playbook_dir}}/build/chroot/boot/u-boot-splx4.sfp of={{ sd_dev }}p2
        partprobe {{ sd_dev }}
      tags: uboot

    - name: Wipe /boot partition
      community.general.filesystem:
        dev: '{{ sd_dev }}p1'
        state: absent
      tags: wipe

    - name: Wipe rootfs partition
      community.general.filesystem:
        dev: '{{ sd_dev }}p3'
        state: absent
      tags: wipe

    - name: Format /boot filesystem
      community.general.filesystem:
        dev: '{{ sd_dev }}p1'
        fstype: ext4
        opts: -L chameleon_boot
        state: present

    - name: Format rootfs filesystem
      community.general.filesystem:
        dev: '{{ sd_dev }}p3'
        fstype: btrfs
        opts: -L chameleon_fs
        state: present

    - name: Create fs dir structure and mount everything in its proper spot
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        warn: false # silence mkdir warning
                    # mount module would work better too, but that's also
                    # unsuitable without touching the local /etc/fstab
        cmd: |
          mkdir -p sd &&
          mount {{ sd_dev }}p3 sd &&
          btrfs subvolume create sd/root &&
          mkdir -p sd/root/mnt/fs &&
          mkdir -p sd/root/boot &&
          mount {{ sd_dev }}p1 sd/root/boot

    - name: Install /etc/fstab
      ansible.builtin.copy:
        remote_src: yes
        src: '{{playbook_dir}}/files/fstab'
        dest: '{{playbook_dir}}/build/chroot/etc/fstab'

    - name: Cleanup chroot source before copying
      # Less stuff to copy
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R chroot
          rm -Rf chroot/var/cache/pacman/pkg/*
          rm -Rf chroot/home/*/.cache/*
        removes: chroot/var/cache/pacman/pkg/*
      tags: cleanup

    - name: Rsync rootfs from chroot to sd card
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          rsync --archive --hard-links --acls --xattrs --sparse -recursive chroot/* sd/root/
          sync

    - name: Snapshot root
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build/sd'
        cmd: |
          btrfs subvolume snapshot -r root snapshot-$(date -Iminutes)

    - name: Unmount partitions
      ansible.builtin.shell:
        chdir: '{{playbook_dir}}/build'
        cmd: |
          umount -R sd/root/boot
          umount -R sd
