# Copy this file and pass it with -i to ansible-playbook
# or append it to /etc/ansible/hosts

all:
  vars:
    username: cros
    hostname: chameleon

    host_username: your_host_username
    ssh_key:     '/home/{{host_username}}/.ssh/id_ed25519'
    # or perhaps use the chromeos test keys instead:
    #ssh_key:     '/home/{{host_username}}/cros/src/third_party/chromiumos-overlay/chromeos-base/chromeos-ssh-testkeys/files/testing_rsa'
    ssh_key_pub: '{{ssh_key}}.pub'
    ansible_ssh_private_key_file: '{{ssh_key}}'
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    # How u-boot package (which loads appropriate fpga bitstream) is selected
    # One of: 270_2, 270_3, 480_2
    fpga_type: '480_2'

    # Where to put stuff
    chameleon_dir: '/home/{{username}}/chameleon/'

archlinuxarm: # hosts targeted by most alarm-ansible scripts
  hosts:
    # 'archlinuxarm-chroot:' host is dynamically added at the end of first playbook

    # In theory this project can be used without any inventory in this section
    # but if you want to provision over ssh you can do it by uncommenting
    # some of the example chameleon_physical hosts below

  children:
    chameleon_physical: # hosts targeted by scripts wanting to run on a real chameleon
      vars:
        ansible_python_interpreter: '/usr/bin/python' # silences a warning
        ansible_user: '{{username}}'
      hosts:
        #lan-chameleon: # chameleon on your lan
          #ansible_host: yourchameleon.lan

        #some-lab-chameleon:
          #ansible_host: chromeos15-rowxxxxx-rackxxxxx-hostxxxx-chameleon.cros.corp.google.com
