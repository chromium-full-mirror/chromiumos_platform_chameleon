# Copy this file and pass it with -i to ansible-playbook
# or append it to /etc/ansible/hosts

archlinuxarm: # hosts targeted by alarm-ansible
  vars:
    username: cros
    hostname: chameleon

    host_username: your_host_username
    ssh_key:     '/home/{{host_username}}/.ssh/id_rsa'
    # or perhaps use the chromeos test keys instead:
    #ssh_key:     '/home/{{host_username}}/cros/src/third_party/chromiumos-overlay/chromeos-base/chromeos-ssh-testkeys/files/testing_rsa'
    ssh_key_pub: '{{ssh_key}}.pub'
    ansible_ssh_private_key_file: '{{ssh_key}}'

    # How the fpga.rbf file is selected on the device
    # One of: 10AS027E4F29E3LG, 10AS027E2F29I2SG, 10AS048E3F29I2SG
    fpga_type: '10AS048E3F29I2SG'

    # Where to put stuff
    chameleon_dir: '/home/{{username}}/chameleon/'
    pkg_dir: '{{chameleon_dir}}/v3/alarm/linux-enclustra'

  hosts:
    # 'archlinuxarm-chroot:' host is dynamically added at the end of first playbook

    # In theory this project can be used without any inventory in this section
    # but if you want to provision over ssh you can do it by uncommenting
    # the following

    #chameleon:
      #ansible_host: yourchameleon.lan
      #ansible_user: alarm     # halfway through you need to restart the playbooks with the proper {{username}} instead of alarm
      #ansible_ssh_pass: alarm # then delete this line, since ssh keys will be installed
      #ansible_python_interpreter: '/usr/bin/python'
