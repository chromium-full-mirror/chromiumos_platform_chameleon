- name: Look inside intermediate/ before we start building
  hosts: localhost
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_alarm, check_intermediate

  tasks:
    - name: Find fpga-bitstream*.pkg* files nearby
      ansible.builtin.find:
        path: '{{playbook_dir}}/../fpga-bitstream-chameleonv3/'
        patterns: 'fpga-bitstream*.pkg*'
      register: fpga_pkg_files
      tags: fpga, update

    - name: Find uboot*.pkg* files nearby
      ansible.builtin.find:
        path: '{{playbook_dir}}/../uboot-chameleonv3/'
        patterns: "uboot-chameleonv3-{{ fpga_type }}*.pkg*"
      register: uboot_pkg_files
      tags: uboot, update

    - name: Find linux*.pkg* files nearby
      ansible.builtin.find:
        path: '{{playbook_dir}}/../linux-enclustra/'
        patterns: 'linux*.pkg*'
      register: kernel_pkg_files
      tags: kernel, update

    - name: Assert that everything required is there
      ansible.builtin.assert:
        that:
          - fpga_pkg_files.matched
          - uboot_pkg_files.matched
          - kernel_pkg_files.matched
