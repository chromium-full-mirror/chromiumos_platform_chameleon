- name: Install chameleon packages
  hosts: archlinuxarm
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Upload chameleon kernel packages
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /var/cache/pacman/pkg
      # excluding mercury-aa1, since that one will conflict with chameleon
      with_items: "{{ hostvars['localhost']['kernel_pkg_files']['files'] | rejectattr('path', 'search', 'mercury_aa1') }}"
      register: kernel_pkg_files
      tags: install, kernel, update

    - name: Remove generic kernel
      community.general.pacman:
        package:
          - linux-armv7
          - mkinitcpio
          - mkinitcpio-busybox
        state: absent
        extra_args: --cascade
      tags: install, kernel

    - name: Install chameleon kernel package
      community.general.pacman:
        package:
          - "{{ item.dest }}"
        state: present
      with_items: "{{ kernel_pkg_files['results'] }}"
      tags: install, kernel, update

    - name: Upload fpga rbf
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /boot
      with_items: "{{ hostvars['localhost']['fpga_rbf_files']['files'] }}"
      register: fpga_rbf_files
      tags: install, fpga, update

    - name: Enable the correct fpga rbf
      ansible.builtin.copy:
        remote_src: yes
        src: '{{ item.dest }}'
        dest: /boot/fpga.rbf
      with_items: "{{ fpga_rbf_files['results'] | selectattr('dest', 'search', fpga_type) }}"
      tags: install, fpga, update

    - name: Upload uboot.scr
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /boot
      with_items: "{{ hostvars['localhost']['uboot_scr_file']['files'] }}"
      tags: install, uboot

    - name: Weaken sshd security for ChromeOS lab infra, cipher (b/233429241)
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '(PubkeyAuthentication yes)\s+(# The default is to check.*)\n'
        replace: |
            \1
            PubkeyAcceptedKeyTypes=+ssh-rsa # Hack(b/233429241) Lab SSPs still ssh from ubuntu 14.04

            \2
      tags: provision

    - name: Weaken sshd security for ChromeOS lab infra, PermitRootLogin (b/230681207)
      ansible.builtin.lineinfile:
          dest: /etc/ssh/sshd_config
          regexp: '^#PermitRootLogin'
          line: 'PermitRootLogin yes'
      tags: provision

    - name: Install root@ authorized_key for ChromeOS lab infra (b/230681207)
      ansible.posix.authorized_key:
        user: 'root'
        key: "{{ lookup('file', ssh_key_pub) }}"
        state: present
      register: authorized_keys
      tags: user, ssh_key

    - name: Install more tools
      community.general.pacman:
        package:
          - i2c-tools
          - dfu-util
          - protobuf
          - opencv
        state: present
      tags: install

    - name: Install tools from the AUR
      vars:
        ansible_become_user: '{{username}}'
      community.general.pacman:
        executable: 'pikaur'
        package:
          - stm32flash
          - libgpiod
      tags: install, pikaur

    - name: Install python things
      community.general.pacman:
        package:
          - python-pyserial
          - python-sphinx
          - python-wheel
          - python-cffi
          - python-numpy
          - python-opencv
        state: present
      tags: install, python

    - name: Install pigweed
      # as root, in case our tools need sudo
      ansible.builtin.pip:
        name: pigweed
      tags: python, pip

    - name: Copy chameleond.service
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/chameleond.service'
        dest: /etc/systemd/system
      tags: chameleond_service, provision

    - name: Set username in chameleond.service
      ansible.builtin.replace:
        path: /etc/systemd/system/chameleond.service
        regexp: 'USERNAME_HERE'
        replace: '{{username}}'
      tags: chameleond_service, provision

    - name: Enable chameleond service
      ansible.builtin.systemd:
        name: chameleond
        enabled: yes
      tags: chameleond_service, provision

- name: Chameleon user things
  hosts: archlinuxarm
  vars:
    ansible_become: yes
    ansible_become_user: '{{username}}'
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Install our bashrc
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/bashrc'
        dest: '~/.bashrc'
      tags: provision, bashrc

    - name: Checkout chameleon public repo
      ansible.builtin.git:
        repo: 'https://chromium.googlesource.com/chromiumos/platform/chameleon'
        dest: '{{chameleon_dir}}'
      tags: git, update
