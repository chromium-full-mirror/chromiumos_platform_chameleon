- name: Install chameleon packages
  hosts: archlinuxarm
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Add chameleon pacman repo
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '(mirrorlist)\s+(# An example .*)\n'
        replace: |
            \1

            [chameleon]
            SigLevel = Optional TrustedOnly
            Server = https://storage.googleapis.com/chromeos-hardware-tools-chameleon-v3/pkg

            \2
      tags: install, chameleon_pkg_repo

    - name: Remove generic kernel
      community.general.pacman:
        package:
          - linux-armv7
          - mkinitcpio
          - mkinitcpio-busybox
        state: absent
        extra_args: --cascade
      tags: install, kernel

    - name: Install chameleon repo packages
      community.general.pacman:
        update_cache: yes
        package:
          - fpga-bitstream-chameleonv3
          - "uboot-chameleonv3-{{ fpga_type }}"
          - linux-enclustra-chameleonv3
          - linux-enclustra-headers
          - ec-firmware-chameleonv3
        state: latest
      tags: install, fpga, uboot, kernel, ec, update, chameleon_pkg_repo

    - name: Weaken sshd security for ChromeOS lab infra, cipher (b/233429241)
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '(PubkeyAuthentication yes)\s+(# The default is to check.*)\n'
        replace: |
            \1
            PubkeyAcceptedKeyTypes=+ssh-rsa # Hack(b/233429241) Lab SSPs still ssh from ubuntu 14.04

            \2
      tags: provision

    - name: Weaken sshd security for ChromeOS lab infra, PermitRootLogin (b/230681207)
      ansible.builtin.lineinfile:
          dest: /etc/ssh/sshd_config
          regexp: '^#PermitRootLogin'
          line: 'PermitRootLogin yes'
      tags: provision

    - name: Install root@ authorized_key for ChromeOS lab infra (b/230681207)
      ansible.posix.authorized_key:
        user: 'root'
        key: "{{ lookup('file', ssh_key_pub) }}"
        state: present
      register: authorized_keys
      tags: user, ssh_key

    - name: timesyncd.conf.d/
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d/
        state: directory
      tags: provision, ntp

    - name: Google NTP Servers
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/google.conf
        content: |
          [Time]
          NTP=time.google.com
      tags: provision, ntp

    - name: Install some userspace packages
      community.general.pacman:
        package:
          - v4l-utils
          - i2c-tools
          - dfu-util
          - python-pyserial
          - python-cffi
          - python-numpy
          - imagemagick
        state: present
      tags: install, python

    - name: Build and install more packages from the AUR
      vars:
        ansible_become_user: '{{username}}'
      ansible.builtin.shell: |
        PKGDEST=/var/cache/pacman/pkg pikaur -Syu python-pigweed libgpiod stm32flash --mflags=--nocheck --noconfirm --needed
      tags: install, pikaur

    - name: Copy chameleond.service
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/chameleond.service'
        dest: /etc/systemd/system
      tags: chameleond_service, provision

    - name: Set username in chameleond.service
      ansible.builtin.replace:
        path: /etc/systemd/system/chameleond.service
        regexp: 'USERNAME_HERE'
        replace: '{{username}}'
      tags: chameleond_service, provision

    - name: Enable chameleond service
      ansible.builtin.systemd:
        name: chameleond
        enabled: yes
      tags: chameleond_service, provision

    - name: Install /etc/fstab
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/fstab'
        dest: '/etc/fstab'
      tags: provision

- name: Chameleon user things
  hosts: archlinuxarm
  vars:
    ansible_become: yes
    ansible_become_user: '{{username}}'
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Install our bashrc
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/bashrc'
        dest: '~/.bashrc'
      tags: provision, bashrc

    - name: Install our bash_history
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/bash_history'
        dest: '~/.bash_history'
        force: false # do not replace if there's already one there
      tags: provision, bash_history

    - name: Install our .gitconfig
      ansible.builtin.copy:
        dest: '~/.gitconfig'
        force: false # do not replace if there's already one there
        content: |
          [user]
            # useful for hacking with gerrit commands like cherry-pick
            email = chameleon-v3-device@chromium.org
            name = Chameleon User
      tags: provision, gitconfig

    - name: Checkout chameleon public repo
      ansible.builtin.git:
        repo: 'https://chromium.googlesource.com/chromiumos/platform/chameleon'
        dest: '{{chameleon_dir}}'
      tags: git, update
