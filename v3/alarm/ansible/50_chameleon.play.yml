- name: Install chameleon packages
  hosts: archlinuxarm
  vars:
    ansible_become: yes
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Upload chameleon kernel packages
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /var/cache/pacman/pkg
      with_items: "{{ hostvars['localhost']['kernel_pkg_files']['files'] }}"
      register: kernel_pkg_files
      tags: install, kernel, update

    - name: Remove generic kernel
      community.general.pacman:
        package:
          - linux-armv7
          - mkinitcpio
          - mkinitcpio-busybox
        state: absent
        extra_args: --cascade
      tags: install, kernel

    - name: Install chameleon kernel package
      community.general.pacman:
        package:
          - "{{ item.dest }}"
        state: present
      with_items: "{{ kernel_pkg_files['results']}}"
      tags: install, kernel, update

    - name: Upload chameleon uboot packages
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /var/cache/pacman/pkg
      with_items: "{{ hostvars['localhost']['uboot_pkg_files']['files'] }}"
      register: uboot_pkg_files
      tags: install, uboot, update

    - name: Install chameleon uboot package
      community.general.pacman:
        package:
          - "{{ item.dest }}"
        state: present
      with_items: "{{ uboot_pkg_files['results'] }}"
      tags: install, uboot, update

    - name: Upload chameleon fpga bitstream package
      ansible.builtin.copy:
        src: '{{ item.path }}'
        dest: /var/cache/pacman/pkg
      with_items: "{{ hostvars['localhost']['fpga_pkg_files']['files'] }}"
      register: fpga_pkg_files
      tags: install, fpga, update

    - name: Install chameleon fpga bitstream package
      community.general.pacman:
        package:
          - "{{ item.dest }}"
        state: present
      with_items: "{{ fpga_pkg_files['results'] }}"
      tags: install, fpga, update

    - name: Weaken sshd security for ChromeOS lab infra, cipher (b/233429241)
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '(PubkeyAuthentication yes)\s+(# The default is to check.*)\n'
        replace: |
            \1
            PubkeyAcceptedKeyTypes=+ssh-rsa # Hack(b/233429241) Lab SSPs still ssh from ubuntu 14.04

            \2
      tags: provision

    - name: Weaken sshd security for ChromeOS lab infra, PermitRootLogin (b/230681207)
      ansible.builtin.lineinfile:
          dest: /etc/ssh/sshd_config
          regexp: '^#PermitRootLogin'
          line: 'PermitRootLogin yes'
      tags: provision

    - name: Install root@ authorized_key for ChromeOS lab infra (b/230681207)
      ansible.posix.authorized_key:
        user: 'root'
        key: "{{ lookup('file', ssh_key_pub) }}"
        state: present
      register: authorized_keys
      tags: user, ssh_key

    - name: Install some userspace packages
      community.general.pacman:
        package:
          - v4l-utils
          - i2c-tools
          - dfu-util
          - python-pyserial
          - python-cffi
          - python-numpy
        state: present
      tags: install, python

    - name: Build and install more packages from the AUR
      # This could have been community.general.pacman with executable: pikaur
      # But glinux's ansible doesn't support that option yet
      vars:
        ansible_become_user: '{{username}}'
      ansible.builtin.shell: |
        PKGDEST=/var/cache/pacman/pkg pikaur -Syu python-pigweed libgpiod stm32flash --mflags=--nocheck --noconfirm --needed
      tags: install, pikaur

    - name: Copy chameleond.service
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/chameleond.service'
        dest: /etc/systemd/system
      tags: chameleond_service, provision

    - name: Set username in chameleond.service
      ansible.builtin.replace:
        path: /etc/systemd/system/chameleond.service
        regexp: 'USERNAME_HERE'
        replace: '{{username}}'
      tags: chameleond_service, provision

    - name: Enable chameleond service
      ansible.builtin.systemd:
        name: chameleond
        enabled: yes
      tags: chameleond_service, provision

    - name: Install /etc/fstab
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/fstab'
        dest: '/etc/fstab'
      tags: provision

- name: Chameleon user things
  hosts: archlinuxarm
  vars:
    ansible_become: yes
    ansible_become_user: '{{username}}'
  tags: chameleon, chameleon_alarm

  tasks:
    - name: Install our bashrc
      ansible.builtin.copy:
        src: '{{playbook_dir}}/files/bashrc'
        dest: '~/.bashrc'
      tags: provision, bashrc

    - name: Checkout chameleon public repo
      ansible.builtin.git:
        repo: 'https://chromium.googlesource.com/chromiumos/platform/chameleon'
        dest: '{{chameleon_dir}}'
      tags: git, update
