CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ASSERT=y

CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_PROMPT_UART="$ "
CONFIG_SHELL_CMD_BUFF_SIZE=1024

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_SPEED=y
# default to write LOG_LEVEL_INF
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_PINCTRL=y

CONFIG_NANOPB=y
CONFIG_PIGWEED_CHECKSUM=y
CONFIG_PIGWEED_HDLC_RPC=y
CONFIG_PIGWEED_ROUTER_PACKET_PARSER=y
CONFIG_PIGWEED_RPC_COMMON=y
CONFIG_PIGWEED_RPC_SERVER=y
CONFIG_PIGWEED_SYS_IO=y
CONFIG_PIGWEED_THREAD_SLEEP=y
