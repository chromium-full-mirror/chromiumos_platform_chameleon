# rsyslog rule to redirect pulseaudio logs to /var/log/pulse.log
# and set the owner to 'pi' so it is readable/writable correctly.

# Custom timestamp template with microsecond precision. Example output:
# Jul  7 03:06:27.512880 I: pulseaudio[14664]: [pulseaudio] client.c: ...
template(name="TraditionalWithMicroseconds" type="list") {
    property(name="timestamp" dateFormat="rfc3164")
    constant(value=".")
    property(name="timestamp" dateFormat="subseconds")
    constant(value=" ")
    property(name="syslogseverity-text"
             position.from="1"
             position.to="1"
             caseConversion="upper")
    constant(value=": ")
    property(name="syslogtag")
    property(name="msg")
    constant(value="\n")
}

if $programname == 'pulseaudio' then {
    action(type="omfile"
           file="/var/log/pulse.log"
           template="TraditionalWithMicroseconds"
           fileOwner="pi"
           fileGroup="pi"
           fileCreateMode="0644")
    stop
}
